spring:
  application:
    name: dlass-backend

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  mongodb:
    uri: mongodb://localhost:27017/dlass_db

server:
  port: 8080