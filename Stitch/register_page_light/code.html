<style>
        body {
            background-color: #f8fafc; /* Overriding for the specific "Light Mode" request while maintaining System structure */
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="font-body text-slate-800 min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 -z-10 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary/10 blur-[120px]"></div>
</div>
<!-- Main Registration Shell -->
<main class="w-full max-w-xl px-6 py-12">
<div class="glass-card p-10 md:p-12 rounded-lg shadow-[0_20px_40px_-10px_rgba(20,184,166,0.1)] transition-all duration-300">
<!-- Brand Identity -->
<header class="text-center mb-10">
<div class="inline-flex items-center justify-center p-3 mb-6 rounded-2xl bg-gradient-to-br from-primary to-secondary">
<span class="material-symbols-outlined text-white text-3xl" data-icon="cloud_done">cloud_done</span>
</div>
<h1 class="font-headline text-4xl font-extrabold tracking-tighter text-slate-900 mb-2">
                    DLASS
                </h1>
<p class="text-slate-500 font-medium">Elevate your intelligence workflow</p>
</header>
<!-- Registration Form -->
<form action="#" class="space-y-6">
<div class="grid grid-cols-1 gap-6">
<!-- Name Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 ml-1" for="full_name">Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-white/50 border-0 ring-1 ring-slate-200 rounded-lg focus:ring-2 focus:ring-primary-container transition-all outline-none text-slate-900 placeholder:text-slate-400" id="full_name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-white/50 border-0 ring-1 ring-slate-200 rounded-lg focus:ring-2 focus:ring-primary-container transition-all outline-none text-slate-900 placeholder:text-slate-400" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Fields Group -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-white/50 border-0 ring-1 ring-slate-200 rounded-lg focus:ring-2 focus:ring-primary-container transition-all outline-none text-slate-900 placeholder:text-slate-400" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 ml-1" for="confirm_password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl" data-icon="verified_user">verified_user</span>
<input class="w-full pl-12 pr-4 py-4 bg-white/50 border-0 ring-1 ring-slate-200 rounded-lg focus:ring-2 focus:ring-primary-container transition-all outline-none text-slate-900 placeholder:text-slate-400" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 px-6 mt-4 bg-gradient-to-r from-primary to-secondary hover:shadow-[0_0_20px_rgba(79,219,200,0.4)] text-on-primary font-bold rounded-xl transition-all active:scale-[0.98]" type="submit">
                    Create Account
                </button>
<!-- Redirect Option -->
<div class="pt-8 text-center">
<p class="text-slate-500 text-sm">
                        Already have an account? 
                        <a class="text-primary-container font-bold hover:underline transition-all" href="#">Log in instead</a>
</p>
</div>
</form>
</div>
<!-- Secondary Information / Footer -->
<footer class="mt-12 flex flex-col md:flex-row justify-between items-center gap-6 px-4">
<div class="text-slate-400 text-xs font-label uppercase tracking-widest">
                © 2024 DLASS Intelligence. All rights reserved.
            </div>
<div class="flex gap-6">
<a class="text-slate-400 hover:text-primary transition-colors text-xs font-medium" href="#">Terms of Service</a>
<a class="text-slate-400 hover:text-primary transition-colors text-xs font-medium" href="#">Privacy Policy</a>
</div>
</footer>
</main>
<!-- Aesthetic Corner Images -->
<div class="fixed top-12 right-12 w-32 h-32 opacity-20 pointer-events-none hidden lg:block">
