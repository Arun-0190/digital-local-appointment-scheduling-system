<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary": "#00363e",
              "secondary-fixed-dim": "#2fd9f4",
              "on-error": "#690005",
              "secondary-fixed": "#a2eeff",
              "inverse-surface": "#dae2fd",
              "surface-container-high": "#222a3d",
              "inverse-primary": "#006b5f",
              "tertiary": "#ffb2b9",
              "on-primary-fixed": "#00201c",
              "primary-container": "#14b8a6",
              "surface": "#0b1326",
              "on-secondary-fixed": "#001f25",
              "error": "#ffb4ab",
              "primary": "#4fdbc8",
              "on-surface": "#dae2fd",
              "on-primary-container": "#00423b",
              "on-surface-variant": "#bbcac6",
              "secondary": "#5de6ff",
              "on-tertiary-container": "#770827",
              "primary-fixed": "#71f8e4",
              "error-container": "#93000a",
              "on-secondary-container": "#00515d",
              "on-primary": "#003731",
              "surface-container-low": "#131b2e",
              "surface-bright": "#31394d",
              "primary-fixed-dim": "#4fdbc8",
              "on-background": "#dae2fd",
              "surface-container-lowest": "#060e20",
              "on-tertiary": "#67001f",
              "tertiary-fixed": "#ffdadc",
              "surface-container": "#171f33",
              "surface-dim": "#0b1326",
              "outline-variant": "#3c4947",
              "tertiary-fixed-dim": "#ffb2b9",
              "surface-variant": "#2d3449",
              "on-secondary-fixed-variant": "#004e5a",
              "on-error-container": "#ffdad6",
              "on-primary-fixed-variant": "#005048",
              "on-tertiary-fixed-variant": "#891933",
              "on-tertiary-fixed": "#400010",
              "outline": "#859490",
              "tertiary-container": "#ff7a8c",
              "inverse-on-surface": "#283044",
              "secondary-container": "#00cbe6",
              "surface-container-highest": "#2d3449",
              "background": "#0b1326",
              "surface-tint": "#4fdbc8"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(23, 31, 51, 0.4);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(113, 248, 228, 0.2);
            border-left: 1px solid rgba(113, 248, 228, 0.2);
        }
        .luminous-glow {
            box-shadow: 0 20px 40px -10px rgba(79, 219, 200, 0.08);
        }
        .bg-mesh {
            background-color: #0b1326;
            background-image: 
                radial-gradient(at 0% 0%, rgba(20, 184, 166, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.1) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh font-body text-on-surface min-h-screen flex flex-col selection:bg-primary/30">
<!-- Top Navigation Suppression (Task-Focused Page) -->
<main class="flex-grow flex items-center justify-center p-6 md:p-12">
<!-- Asymmetric Background Decorative Elements -->
<div class="fixed top-[-10%] right-[-5%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-5%] w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Centered Glass Card -->
<div class="glass-card luminous-glow w-full max-w-[520px] rounded-lg p-10 md:p-14 relative z-10 overflow-hidden">
<!-- Brand Anchor -->
<div class="mb-10 text-center">
<span class="font-headline font-black tracking-tighter bg-gradient-to-br from-teal-400 to-cyan-400 bg-clip-text text-transparent text-4xl mb-4 block">DLASS</span>
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface mb-2">Create an account</h1>
<p class="text-on-surface-variant font-body">Join the future of intelligence concierge.</p>
</div>
<!-- Registration Form -->
<form action="#" class="space-y-6" onsubmit="return false">
<!-- Name Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface-variant px-1" for="full-name">Full Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full bg-surface-container-lowest border-none focus:ring-1 focus:ring-primary rounded-md py-4 pl-12 pr-4 text-on-surface placeholder:text-outline transition-all duration-300" id="full-name" placeholder="Alex Morgan" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface-variant px-1" for="email">Email address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full bg-surface-container-lowest border-none focus:ring-1 focus:ring-primary rounded-md py-4 pl-12 pr-4 text-on-surface placeholder:text-outline transition-all duration-300" id="email" placeholder="alex@example.com" type="email"/>
</div>
</div>
<!-- Password Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border-none focus:ring-1 focus:ring-primary rounded-md py-4 pl-12 pr-4 text-on-surface placeholder:text-outline transition-all duration-300" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface-variant px-1" for="confirm-password">Confirm</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">shield</span>
</div>
<input class="w-full bg-surface-container-lowest border-none focus:ring-1 focus:ring-primary rounded-md py-4 pl-12 pr-4 text-on-surface placeholder:text-outline transition-all duration-300" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-outline-variant bg-surface-container text-primary-container focus:ring-primary focus:ring-offset-surface" id="terms" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant leading-tight" for="terms">
                        I agree to the <a class="text-primary hover:text-secondary-fixed-dim transition-colors" href="#">Terms of Service</a> and <a class="text-primary hover:text-secondary-fixed-dim transition-colors" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Create Account Button -->
<button class="w-full bg-gradient-to-r from-primary to-secondary text-on-primary py-4 rounded-xl font-headline font-extrabold text-lg shadow-lg hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 mt-4 group" type="submit">
                    Create Account
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer Option -->
<div class="mt-10 text-center border-t border-outline-variant/10 pt-8">
<p class="text-on-surface-variant">
                    Already have an account? 
                    <a class="text-secondary font-medium hover:text-primary transition-colors ml-1" href="#">Log in instead</a>
</p>
</div>
</div>
</main>
<!-- Footer Component from JSON -->
<footer class="bg-slate-950 w-full py-12 px-8 z-20">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
<div class="flex items-center gap-4">
<span class="font-manrope font-bold text-teal-400">DLASS Intelligence</span>
<span class="hidden md:block w-[1px] h-4 bg-slate-800"></span>
<p class="font-inter text-sm tracking-wide text-slate-500">© 2024 DLASS Intelligence. All rights reserved.</p>
</div>
<div class="flex gap-8">
<a class="font-inter text-sm tracking-wide text-slate-500 hover:text-teal-300 transition-colors opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="font-inter text-sm tracking-wide text-slate-500 hover:text-teal-300 transition-colors opacity-80 hover:opacity-100" href="#">Terms of Service</a>
<a class="font-inter text-sm tracking-wide text-slate-500 hover:text-teal-300 transition-colors opacity-80 hover:opacity-100" href="#">Help Center</a>
</div>
</div>
</footer>
</body></html>
